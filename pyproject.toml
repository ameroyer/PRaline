[project]
name = "PRaline"
version = "0.1.0"
description = "Automated PR review CLI powered by Claude"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "markdown>=3.6",
]

[project.scripts]
praline = "praline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# prompts.py is prose addressed to a model, not code. Wrapping it to the code
# line length would only make the prompts harder to read and edit.
"praline/prompts.py" = ["E501"]
