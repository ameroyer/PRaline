[project]
name = "PRaline"
version = "0.1.0"
description = "Automated PR review CLI powered by Claude"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "markdown>=3.6",
]

[project.optional-dependencies]
# The MCP server is the only thing that needs this, and it is not needed to
# review a PR from the terminal.
mcp = ["mcp>=1.2"]

[project.scripts]
praline = "praline.cli:main"
praline-mcp = "praline.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Both files are mostly prose addressed to a model, not code. Wrapping them to
# the code line length would only make the prompts harder to read and edit.
"praline/prompts.py" = ["E501"]
"praline/hardness.py" = ["E501"]
